<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PeopleDesk | Payroll and Attendance</title>
<style>
:root{--navy:#17334f;--navy2:#234968;--blue:#3978df;--mint:#38a98a;--ink:#253344;--muted:#718195;--line:#e3e9f0;--bg:#f4f7fa;--white:#fff;--green:#208366;--amber:#a9761b;--red:#bb5a59;--shadow:0 6px 22px #213b5710}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",Arial,sans-serif}.app{display:flex;min-height:100vh}.side{width:238px;background:var(--navy);color:#d8e3ed;padding:23px 15px;display:flex;flex-direction:column;flex-shrink:0}.brand{display:flex;align-items:center;gap:11px;color:#fff;font-weight:700;font-size:16px;padding:0 10px 29px}.mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#69adff,#3573e1);display:grid;place-items:center;font-size:18px}.label{font-size:10px;color:#91a5b8;letter-spacing:1.3px;text-transform:uppercase;padding:0 12px 8px;font-weight:700}.nav{display:grid;gap:5px}.nav button{height:41px;padding:0 12px;color:#bac9d7;background:none;border:0;border-radius:8px;text-align:left;display:flex;align-items:center;gap:12px;cursor:pointer}.nav button.active,.nav button:hover{background:#ffffff17;color:#fff}.nav button.active{box-shadow:inset 3px 0 #72b1ff}.ico{width:17px;text-align:center;font-size:16px}.sidefoot{margin-top:auto;padding:18px 9px 0;border-top:1px solid #ffffff22;color:#becbd7;font-size:11px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#42c58d;margin-right:7px}.sidefoot small{display:block;margin:8px 0 0 15px;color:#95aabd;line-height:1.5}.main{flex:1;min-width:0}.top{height:71px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:4}.crumb{font-size:12px;color:var(--muted)}.crumb strong{font-size:15px;color:var(--ink);margin-left:8px}.right{display:flex;align-items:center;gap:15px}.search{width:250px;height:35px;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;gap:8px;padding:0 10px;color:#9ba7b5}.search input{border:0;outline:0;width:100%;font-size:12px}.avatar{width:33px;height:33px;border-radius:50%;display:grid;place-items:center;color:#315ea2;background:#e8f0ff;font-size:11px;font-weight:700}.content{max-width:1360px;padding:27px 30px 45px;margin:auto}.welcome{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px}.welcome h1{font-size:23px;margin:0 0 4px}.welcome p,.muted{color:var(--muted);margin:0;font-size:12px}.date{font-size:11px;color:var(--muted);background:#fff;border:1px solid var(--line);padding:8px 12px;border-radius:8px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.metric{padding:16px 18px;min-height:111px}.metric-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px}.bubble{height:32px;width:32px;border-radius:9px;display:grid;place-items:center;background:#edf4ff;color:var(--blue);font-size:15px}.bubble.green{background:#e6f7f1;color:var(--mint)}.bubble.amber{background:#fff4e2;color:#bd872d}.bubble.purple{background:#f0edff;color:#765bc7}.number{font-weight:700;font-size:22px;letter-spacing:-.4px;margin-top:10px}.note{font-size:10px;color:var(--muted);margin-top:1px}.two{display:grid;grid-template-columns:1.35fr 1fr;gap:15px;margin-bottom:16px}.panel{padding:18px}.panelhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.panelhead h2{font-size:14px;margin:0}.hint{font-size:10px;color:var(--muted);margin-top:3px}.bars{height:164px;display:flex;align-items:end;justify-content:space-around;border-bottom:1px solid var(--line);gap:8px}.month{height:100%;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:7px;font-size:10px;color:var(--muted);z-index:1}.barpair{height:130px;display:flex;align-items:end;gap:4px}.bar{width:13px;border-radius:4px 4px 0 0;background:var(--blue);min-height:3px}.bar.alt{background:#a9c5f2}.legend{display:flex;justify-content:center;gap:17px;color:var(--muted);font-size:10px;margin-top:10px}.sw{width:8px;height:8px;display:inline-block;border-radius:2px;background:var(--blue);margin-right:5px}.sw.alt{background:#a9c5f2}.mini-list{display:grid;gap:10px}.mini-row{display:grid;grid-template-columns:1fr 1.5fr 45px;gap:8px;align-items:center;font-size:10px}.track{height:8px;border-radius:8px;background:#edf1f5;overflow:hidden}.fill{height:100%;background:var(--blue);border-radius:8px}.tablecard{overflow:hidden}.tablehead{padding:17px 18px 0;display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}.tablehead h2{font-size:14px;margin:0}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th{background:#fafbfd;color:#8491a0;text-align:left;text-transform:uppercase;letter-spacing:.5px;font-size:9px;padding:11px 14px;border-top:1px solid #f1f3f5;border-bottom:1px solid var(--line)}td{padding:12px 14px;border-bottom:1px solid #f0f2f5;font-size:11px}tbody tr:last-child td{border-bottom:0}.person{display:flex;align-items:center;gap:8px}.initial{width:27px;height:27px;border-radius:8px;background:#ebf2ff;color:#3d6eba;display:grid;place-items:center;font-size:9px;font-weight:700}.badge{display:inline-block;border-radius:15px;padding:3px 8px;background:#edf2f8;color:#61768e;font-size:9px;font-weight:650}.badge.PRESENT,.badge.APPROVED,.badge.ACTIVE,.badge.PAID{background:#e8f7f1;color:#27836b}.badge.ABSENT,.badge.REJECTED,.badge.INACTIVE{background:#fff0ef;color:#b55d57}.badge.PENDING,.badge.HALF_DAY{background:#fff5df;color:#a5761f}.money{font-weight:650}.toolbar{display:flex;gap:8px;align-items:center}.btn{border:1px solid var(--line);background:#fff;color:#35475a;border-radius:7px;padding:8px 11px;font-size:10px;font-weight:650;cursor:pointer}.btn:hover{background:#f6f9fc}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.link{border:0;background:transparent;color:var(--blue)}.select{border:1px solid var(--line);border-radius:7px;height:32px;padding:0 9px;color:#536477;background:#fff;font-size:10px}.pagehead{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.pagehead h1{font-size:22px;margin:0}.pagehead p{font-size:12px;color:var(--muted);margin:4px 0 0}.notice{border:1px solid #f0dfbd;background:#fff9ec;color:#866b37;border-radius:8px;padding:10px 12px;font-size:10px;margin-top:14px}.modalback{position:fixed;inset:0;background:#0d20385c;z-index:10;display:grid;place-items:center;padding:16px}.modal{width:min(500px,100%);background:#fff;border-radius:13px;box-shadow:0 20px 65px #102b4640;overflow:hidden}.modalhead{padding:16px 19px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modalhead h2{margin:0;font-size:15px}.x{border:0;background:transparent;color:#7d8996;font-size:20px;cursor:pointer}.modalbody{padding:18px}.modalfoot{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:end;gap:8px}.form{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:10px;color:#6d7d8f;font-weight:600}.field input,.field select{height:35px;border:1px solid var(--line);border-radius:7px;padding:0 9px;font-size:11px}.toast{position:fixed;right:22px;bottom:22px;z-index:15;background:var(--navy);color:white;padding:11px 15px;border-radius:8px;font-size:11px;box-shadow:var(--shadow)}.empty{padding:25px;text-align:center;color:var(--muted)}.subgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.print{cursor:pointer}@media(max-width:980px){.side{width:200px}.content{padding:22px}.cards{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}@media(max-width:650px){.side{width:60px;padding:17px 7px}.brand{padding:0 5px 24px}.brand>span:last-child,.label,.nav button span:last-child,.sidefoot small,.sidefoot>span:last-child{display:none}.nav button{justify-content:center;padding:0}.sidefoot{text-align:center}.top{padding:0 12px;height:60px}.search{width:40vw}.content{padding:18px 12px}.welcome{align-items:start;flex-direction:column;gap:10px}.cards{gap:9px}.metric{padding:12px;min-height:98px}.number{font-size:18px}.subgrid{grid-template-columns:1fr}.pagehead{align-items:start;gap:8px}.pagehead .btn{padding:7px}.panel{padding:14px}}
</style></head><body>
<div class="app"><aside class="side"><div class="brand"><div class="mark">P</div><span>PeopleDesk</span></div><div class="label">HR Workspace</div><nav class="nav" id="nav"></nav><div class="sidefoot"><span class="dot"></span><span>Demo mode</span><small>Sample data saved in this browser<br>Not connected to MySQL</small></div></aside><main class="main"><header class="top"><div class="crumb">HR Management <strong id="crumb">Dashboard</strong></div><div class="right"><label class="search">⌕ <input id="search" placeholder="Search employees..."></label><div class="avatar">HR</div></div></header><section class="content" id="content"></section></main></div><div id="modal"></div><div id="toast"></div>
<script>
const navs=[['dashboard','⌂','Dashboard'],['employees','♙','Employees'],['attendance','◷','Attendance'],['leave','▧','Leave Records'],['payroll','₹','Payroll'],['reports','▥','Reports']];
const seed={employees:[{id:1,code:'IT-1001',first:'Aarav',last:'Mehta',email:'aarav.mehta@example.test',department:'Engineering',designation:'Software Engineer',status:'ACTIVE'},{id:2,code:'IT-1002',first:'Sara',last:'Khan',email:'sara.khan@example.test',department:'Quality Assurance',designation:'QA Analyst',status:'ACTIVE'},{id:3,code:'IT-1003',first:'Rohan',last:'Das',email:'rohan.das@example.test',department:'Engineering',designation:'Senior Developer',status:'ACTIVE'}],salary:[{employeeId:1,basic:70000,hra:21000,allowance:5000,deduction:5000},{employeeId:2,basic:55000,hra:16500,allowance:3500,deduction:4000},{employeeId:3,basic:80000,hra:24000,allowance:6000,deduction:8000}],attendance:[{id:1,employeeId:1,date:'2026-10-01',status:'PRESENT',in:'09:05',out:'17:35',hours:8.5},{id:2,employeeId:1,date:'2026-10-02',status:'PRESENT',in:'09:00',out:'17:30',hours:8.5},{id:3,employeeId:1,date:'2026-10-03',status:'ABSENT',in:'',out:'',hours:0},{id:4,employeeId:2,date:'2026-10-01',status:'PRESENT',in:'09:15',out:'17:15',hours:8},{id:5,employeeId:2,date:'2026-10-02',status:'HALF_DAY',in:'09:00',out:'13:00',hours:4},{id:6,employeeId:2,date:'2026-10-03',status:'PRESENT',in:'09:10',out:'17:25',hours:8.25},{id:7,employeeId:3,date:'2026-10-01',status:'PRESENT',in:'08:55',out:'17:45',hours:8.83},{id:8,employeeId:3,date:'2026-10-02',status:'PRESENT',in:'09:00',out:'17:40',hours:8.67},{id:9,employeeId:3,date:'2026-10-03',status:'PRESENT',in:'09:10',out:'17:30',hours:8.33}],leave:[{id:1,employeeId:2,type:'ANNUAL',start:'2026-10-12',end:'2026-10-13',status:'APPROVED'},{id:2,employeeId:3,type:'SICK',start:'2026-10-20',end:'2026-10-20',status:'PENDING'}],payroll:[{id:1,employeeId:1,month:'2026-10-01',days:22,gross:96000,deductions:5000,net:91000},{id:2,employeeId:2,month:'2026-10-01',days:21,gross:75000,deductions:4000,net:71000},{id:3,employeeId:3,month:'2026-10-01',days:22,gross:110000,deductions:8000,net:102000}]};
let d;try{d=JSON.parse(localStorage.getItem('peopleDeskPayrollDemo')||'null')||structuredClone(seed)}catch(e){d=JSON.parse(JSON.stringify(seed))}let page='dashboard',term='';const $=s=>document.querySelector(s),money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(n),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),emp=id=>d.employees.find(e=>e.id===id),empName=id=>{let e=emp(id);return e?e.first+' '+e.last:'Unknown'},initials=t=>String(t).split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase(),save=()=>localStorage.setItem('peopleDeskPayrollDemo',JSON.stringify(d)),balSalary=id=>d.salary.find(s=>s.employeeId===id),badge=s=>`<span class="badge ${esc(s)}">${esc(s)}</span>`,datefmt=s=>s?new Date(s+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):'—',toast=m=>{$('#toast').innerHTML=`<div class="toast">${esc(m)}</div>`;setTimeout(()=>$('#toast').innerHTML='',2600)};
function head(title,desc,action=''){return `<div class="pagehead"><div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`}function metric(label,val,note,icon,cls=''){return `<div class="card metric"><div class="metric-top">${label}<span class="bubble ${cls}">${icon}</span></div><div class="number">${val}</div><div class="note">${note}</div></div>`}function avatarCell(e){return `<div class="person"><span class="initial">${initials(e.first+' '+e.last)}</span><span><b>${esc(e.first+' '+e.last)}</b><div class="muted">${esc(e.code)}</div></span></div>`}
function dash(){let gross=d.payroll.reduce((s,p)=>s+p.gross,0),net=d.payroll.reduce((s,p)=>s+p.net,0),pending=d.leave.filter(x=>x.status==='PENDING').length;let by=['Engineering','Quality Assurance'];let bars=['Jun','Jul','Aug','Sep','Oct'].map((m,i)=>`<div class="month"><div class="barpair"><i class="bar" style="height:${40+i*9}%"></i><i class="bar alt" style="height:${25+i*6}%"></i></div>${m}</div>`).join('');let totals=by.map(dep=>{let x=d.employees.filter(e=>e.department===dep).reduce((s,e)=>s+(d.payroll.find(p=>p.employeeId===e.id)?.net||0),0);return `<div class="mini-row"><span>${dep}</span><span class="track"><i class="fill" style="display:block;width:${Math.max(5,Math.min(100,x/1.93e3))}%"></i></span><b>${money(x)}</b></div>`}).join('');return `<div class="welcome"><div><h1>Good morning, HR Team</h1><p>Payroll and attendance overview for your organization.</p></div><div class="date">October 2026 · Sample period</div></div><div class="cards">${metric('Active employees',d.employees.filter(e=>e.status==='ACTIVE').length,'Across all departments','♙')}${metric('Attendance entries',d.attendance.length,'Recorded sample entries','◷','green')}${metric('Payroll gross',money(gross),'October payroll sample','₹','purple')}${metric('Pending leave requests',pending,'Awaiting HR review','▧','amber')}</div><div class="two"><div class="card panel"><div class="panelhead"><div><h2>Monthly activity</h2><div class="hint">Illustrative attendance and payroll trend</div></div><button class="btn link" data-go="reports">View reports →</button></div><div class="bars">${bars}</div><div class="legend"><span><i class="sw"></i>Attendance</span><span><i class="sw alt"></i>Payroll processed</span></div></div><div class="card panel"><div class="panelhead"><div><h2>Payroll by department</h2><div class="hint">Net pay for sample month</div></div></div><div class="mini-list">${totals}</div><div class="notice">Sample data only. Configure actual payroll policy before use.</div></div></div><div class="card tablecard"><div class="tablehead"><div><h2>Employee directory</h2><div class="hint">Quick view of team members</div></div><button class="btn link" data-go="employees">All employees →</button></div><div class="tablewrap"><table><thead><tr><th>Employee</th><th>Department</th><th>Designation</th><th>Status</th></tr></thead><tbody>${d.employees.slice(0,4).map(e=>`<tr><td>${avatarCell(e)}</td><td>${esc(e.department)}</td><td>${esc(e.designation)}</td><td>${badge(e.status)}</td></tr>`).join('')}</tbody></table></div></div>`}
function employees(){let es=d.employees.filter(e=>(e.first+' '+e.last+' '+e.code+' '+e.department).toLowerCase().includes(term));return `${head('Employees','Employee profiles and department assignments.','<button class="btn primary" id="newEmp">＋ Add employee</button>')}<div class="card tablecard"><div class="tablehead"><div><h2>Employee directory</h2><div class="hint">${es.length} profiles</div></div></div><div class="tablewrap"><table><thead><tr><th>Employee</th><th>Email</th><th>Department</th><th>Designation</th><th>Hire date</th><th>Status</th></tr></thead><tbody>${es.map(e=>`<tr><td>${avatarCell(e)}</td><td>${esc(e.email)}</td><td>${esc(e.department)}</td><td>${esc(e.designation)}</td><td>—</td><td>${badge(e.status)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No employees match the search.</td></tr>'}</tbody></table></div></div>`}
function attendance(){let rows=[...d.attendance].sort((a,b)=>b.date.localeCompare(a.date));return `${head('Attendance','Daily attendance, working hours and exceptions.','<button class="btn primary" id="markAttendance">＋ Mark attendance</button>')}<div class="card tablecard"><div class="tablehead"><div><h2>Attendance register</h2><div class="hint">Sample dates from October 2026</div></div><button class="btn" onclick="window.print()">Print</button></div><div class="tablewrap"><table><thead><tr><th>Date</th><th>Employee</th><th>Status</th><th>Check in</th><th>Check out</th><th>Hours</th></tr></thead><tbody>${rows.map(a=>`<tr><td>${datefmt(a.date)}</td><td>${empName(a.employeeId)}</td><td>${badge(a.status)}</td><td>${a.in||'—'}</td><td>${a.out||'—'}</td><td>${Number(a.hours).toFixed(2)}</td></tr>`).join('')}</tbody></table></div></div>`}
function leaves(){return `${head('Leave records','Track employee leave requests and approvals.')}<div class="card tablecard"><div class="tablehead"><div><h2>Leave requests</h2><div class="hint">Approve or reject a pending request in this demo.</div></div></div><div class="tablewrap"><table><thead><tr><th>Employee</th><th>Type</th><th>From</th><th>To</th><th>Status</th><th>Action</th></tr></thead><tbody>${d.leave.map(l=>`<tr><td>${esc(empName(l.employeeId))}</td><td>${esc(l.type)}</td><td>${datefmt(l.start)}</td><td>${datefmt(l.end)}</td><td>${badge(l.status)}</td><td>${l.status==='PENDING'?`<button class="btn small" data-approve="${l.id}">Approve</button> <button class="btn small" data-reject="${l.id}">Reject</button>`:'—'}</td></tr>`).join('')}</tbody></table></div></div><div class="notice">Leave balances are not automatically calculated in this prototype.</div>`}
function payroll(){return `${head('Payroll','Monthly payroll records and net pay.','<button class="btn primary" id="generatePayroll">＋ Generate sample month</button>')}<div class="cards">${metric('Employees paid',d.payroll.length,'Stored payroll rows','✓','green')}${metric('Gross pay',money(d.payroll.reduce((s,p)=>s+p.gross,0)),'Current sample rows','₹','purple')}${metric('Deductions',money(d.payroll.reduce((s,p)=>s+p.deductions,0)),'Configured sample values','−','amber')}${metric('Net pay',money(d.payroll.reduce((s,p)=>s+p.net,0)),'Gross less deductions','₹','green')}</div><div class="card tablecard"><div class="tablehead"><div><h2>Payroll register</h2><div class="hint">One row per employee and payroll month.</div></div><button class="btn" onclick="window.print()">Print</button></div><div class="tablewrap"><table><thead><tr><th>Month</th><th>Employee</th><th>Paid days</th><th>Gross pay</th><th>Deductions</th><th>Net pay</th><th>Status</th></tr></thead><tbody>${d.payroll.map(p=>`<tr><td>${new Date(p.month+'T00:00:00').toLocaleDateString('en-IN',{month:'short',year:'numeric'})}</td><td>${esc(empName(p.employeeId))}</td><td>${p.days}</td><td>${money(p.gross)}</td><td>${money(p.deductions)}</td><td class="money">${money(p.net)}</td><td>${badge('PAID')}</td></tr>`).join('')}</tbody></table></div><div class="notice">Demo calculation uses configured salary components; taxes, statutory deductions and company policy are not implemented.</div></div>`}
function reports(){let deps=[...new Set(d.employees.map(e=>e.department))];let month='2026-10';return `${head('Reports','Monthly attendance and payroll summaries.')}<div class="cards">${metric('Present entries',d.attendance.filter(a=>a.status==='PRESENT').length,'Sample attendance rows','✓','green')}${metric('Absent entries',d.attendance.filter(a=>a.status==='ABSENT').length,'Review required','!','amber')}${metric('Total payroll net',money(d.payroll.reduce((s,p)=>s+p.net,0)),'October 2026 sample','₹','purple')}${metric('Departments',deps.length,'In employee directory','▦')}</div><div class="subgrid"><div class="card panel"><div class="panelhead"><div><h2>Attendance summary</h2><div class="hint">By employee for October 2026</div></div></div><div class="tablewrap"><table><thead><tr><th>Employee</th><th>Present</th><th>Absent</th><th>Hours</th></tr></thead><tbody>${d.employees.map(e=>{let a=d.attendance.filter(x=>x.employeeId===e.id&&x.date.startsWith(month));return `<tr><td>${esc(e.code)}</td><td>${a.filter(x=>x.status==='PRESENT').length}</td><td>${a.filter(x=>x.status==='ABSENT').length}</td><td>${a.reduce((s,x)=>s+Number(x.hours),0).toFixed(2)}</td></tr>`}).join('')}</tbody></table></div></div><div class="card panel"><div class="panelhead"><div><h2>Payroll by department</h2><div class="hint">Net pay totals</div></div></div>${deps.map(dep=>{let emps=d.employees.filter(e=>e.department===dep);let total=d.payroll.filter(p=>emps.some(e=>e.id===p.employeeId)).reduce((s,p)=>s+p.net,0);let max=Math.max(1,...deps.map(dp=>d.payroll.filter(p=>d.employees.some(e=>e.department===dp&&e.id===p.employeeId)).reduce((s,p)=>s+p.net,0)));return `<div class="mini-row" style="margin:13px 0"><span>${esc(dep)}</span><span class="track"><i class="fill" style="display:block;width:${Math.max(4,total/max*100)}%"></i></span><b>${money(total)}</b></div>`}).join('')}</div></div><div class="notice">Reports are computed from this browser's sample records, not from MySQL.</div>`}
function draw(){let names={dashboard:'Dashboard',employees:'Employees',attendance:'Attendance',leave:'Leave Records',payroll:'Payroll',reports:'Reports'};$('#crumb').textContent=names[page];$('#nav').innerHTML=navs.map(([id,ico,n])=>`<button class="${page===id?'active':''}" data-page="${id}"><span class="ico">${ico}</span><span>${n}</span></button>`).join('');$('#nav').querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));let renderers={dashboard:dash,employees,attendance,leave, payroll,reports};$('#content').innerHTML=renderers[page]();$('#content').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));bind()}
function go(p){page=p;draw()}function bind(){if($('#newEmp'))$('#newEmp').onclick=addEmp;if($('#markAttendance'))$('#markAttendance').onclick=markAtt;if($('#generatePayroll'))$('#generatePayroll').onclick=generatePayroll;$('#content').querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>setLeave(+b.dataset.approve,'APPROVED'));$('#content').querySelectorAll('[data-reject]').forEach(b=>b.onclick=()=>setLeave(+b.dataset.reject,'REJECTED'))}
function modal(title,form,saveText,fn){$('#modal').innerHTML=`<div class="modalback" id="back"><div class="modal"><div class="modalhead"><h2>${title}</h2><button class="x" id="x">×</button></div><div class="modalbody">${form}</div><div class="modalfoot"><button class="btn" id="cancel">Cancel</button><button class="btn primary" id="save">${saveText}</button></div></div></div>`;$('#x').onclick=$('#cancel').onclick=()=>$('#modal').innerHTML='';$('#back').onclick=e=>{if(e.target.id==='back')$('#modal').innerHTML=''};$('#save').onclick=()=>{try{if(fn()!==false){$('#modal').innerHTML='';save();draw()}}catch(e){toast(e.message)}}}
function empOpts(){return d.employees.map(e=>`<option value="${e.id}">${esc(e.code)} · ${esc(e.first+' '+e.last)}</option>`).join('')}function fld(label,id,type='text',full=false,placeholder=''){return `<div class="field ${full?'full':''}"><label>${label}</label><input id="${id}" type="${type}" placeholder="${placeholder}" required></div>`}
function addEmp(){modal('Add employee',`<div class="form">${fld('Employee code','ec','text',false,'IT-1004')}${fld('Email','em','email')}${fld('First name','fn')}${fld('Last name','ln')}${fld('Department','dep')}${fld('Designation','des')}${fld('Hire date','hire','date',true)}</div>`,'Save employee',()=>{let code=$('#ec').value.trim(),email=$('#em').value.trim();if(!code||!email||!$('#fn').value.trim()||!$('#ln').value.trim())throw Error('Complete required employee details.');if(d.employees.some(e=>e.code===code||e.email===email))throw Error('Employee code or email already exists.');let id=Math.max(0,...d.employees.map(e=>e.id))+1;d.employees.push({id,code,first:$('#fn').value.trim(),last:$('#ln').value.trim(),email,department:$('#dep').value.trim()||'General',designation:$('#des').value.trim()||'Employee',status:'ACTIVE'});d.salary.push({employeeId:id,basic:0,hra:0,allowance:0,deduction:0});toast('Employee added. Add salary details before payroll.')})}
function markAtt(){modal('Mark attendance',`<div class="form"><div class="field full"><label>Employee</label><select id="ae">${empOpts()}</select></div>${fld('Attendance date','ad','date') }<div class="field"><label>Status</label><select id="as"><option>PRESENT</option><option>ABSENT</option><option>HALF_DAY</option><option>HOLIDAY</option></select></div>${fld('Check in','ain','time')}${fld('Check out','aout','time')}${fld('Hours worked','ah','number',true,'0 to 24')}</div>`,'Save attendance',()=>{let employeeId=+$('#ae').value,date=$('#ad').value,status=$('#as').value,hours=Number($('#ah').value||0);if(!date||hours<0||hours>24)throw Error('Enter a date and hours between 0 and 24.');if(d.attendance.some(a=>a.employeeId===employeeId&&a.date===date))throw Error('Attendance already exists for this employee and date.');d.attendance.push({id:Math.max(0,...d.attendance.map(a=>a.id))+1,employeeId,date,status,in:$('#ain').value,out:$('#aout').value,hours});toast('Attendance recorded.')})}
function setLeave(id,status){let l=d.leave.find(x=>x.id===id);if(l){l.status=status;save();draw();toast('Leave request '+status.toLowerCase()+'.')}}
function generatePayroll(){let month='2026-11-01',eligible=d.employees.filter(e=>e.status==='ACTIVE'&&!d.payroll.some(p=>p.employeeId===e.id&&p.month===month));if(!eligible.length)return toast('Sample month already exists for active employees.');eligible.forEach(e=>{let s=balSalary(e.id)||{basic:0,hra:0,allowance:0,deduction:0},gross=s.basic+s.hra+s.allowance;d.payroll.push({id:Math.max(0,...d.payroll.map(p=>p.id))+1,employeeId:e.id,month,days:0,gross,deductions:s.deduction,net:Math.max(0,gross-s.deduction)})});save();draw();toast('Sample November payroll generated. Attendance days need review.')}
$('#search').oninput=e=>{term=e.target.value.trim().toLowerCase();if(['employees'].includes(page))draw()};draw();
</script></body></html>
